name: social_game_app
description: "Badminton Host Finance App - Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  image_picker: ^1.2.2
  path_provider: ^2.1.4
  uuid: ^4.4.2
  fl_chart: ^0.69.0
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.4.0
  http: ^1.2.2
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
