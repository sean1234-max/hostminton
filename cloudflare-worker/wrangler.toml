name = "sfc-arena-otp"
main = "worker.js"
compatibility_date = "2024-09-23"

# After running: wrangler kv:namespace create OTP_STORE
# paste the returned id below:
kv_namespaces = [
  { binding = "OTP_STORE", id = "145ba7a0732e4e0c88301c5f55cc72d6" }
]

# Secrets (set via: wrangler secret put <NAME>)
# RESEND_API_KEY      – from resend.com dashboard
# SA_EMAIL            – service account email from Firebase
# SA_PRIVATE_KEY      – private key PEM from Firebase service account JSON
# FIREBASE_PROJECT_ID – sfc-arena
